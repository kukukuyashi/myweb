<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Cyinc 的学习日志 — 前端、Agent 与 Java 学习笔记">
    <link rel="icon" type="image/png" href="/myweb/img/xiaoqing.png">
    <link rel="alternate" type="application/rss+xml" title="Cyinc 的学习日志 RSS" href="/myweb/feed.xml">
    <title>Cyinc 的学习日志</title>
    <!-- 字体已自托管（src/styles/_fonts.css），无外部字体依赖 -->
    <style>
      /* 加载屏幕样式 */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f5f2ee;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .loading-screen.fade-out,
      .loading-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-content {
        text-align: center;
        font-family: ui-monospace, 'Cascadia Code', 'IBM Plex Mono', monospace;
      }
      
      .loading-logo {
        font-size: 1.5rem;
        font-weight: 500;
        color: #1a1a1a;
        margin-bottom: 2rem;
        letter-spacing: 0.1em;
      }
      
      .loading-bar {
        width: 200px;
        height: 2px;
        background: #c8c2ba;
        margin: 0 auto 1rem;
        overflow: hidden;
      }
      
      .loading-progress {
        width: 0%;
        height: 100%;
        background: #e85d04;
        animation: loading-progress 1.5s ease-in-out infinite;
      }
      
      .loading-text {
        font-size: 0.75rem;
        color: #5c5c5c;
        letter-spacing: 0.05em;
      }
      
      @keyframes loading-progress {
        0% { width: 0%; transform: translateX(0%); }
        50% { width: 100%; transform: translateX(0%); }
        100% { width: 100%; transform: translateX(100%); }
      }
      
      /* 深色模式支持 */
      [data-theme="dark"] .loading-screen {
        background: #242220;
      }
      
      [data-theme="dark"] .loading-logo {
        color: #eae6e1;
      }
      
      [data-theme="dark"] .loading-bar {
        background: #3a3835;
      }
      
      [data-theme="dark"] .loading-text {
        color: #9a9590;
      }
    </style>
  <script type="module" crossorigin src="/myweb/assets/index-Dhuky6WY.js"></script>
  <link rel="modulepreload" crossorigin href="/myweb/assets/vue-vendor-DBkQmFS8.js">
  <link rel="stylesheet" crossorigin href="/myweb/assets/index-CtrL8InJ.css">
</head>
<body>
    <!-- 加载屏幕 -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-logo">CYINC.LOG</div>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
        <div class="loading-text">加载中...</div>
      </div>
    </div>
    
    <div id="app"></div>
    
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
      // Vue 挂载后隐藏加载屏幕
      function hideLoadingScreen() {
        const loadingScreen = document.getElementById('loading-screen');
        if (!loadingScreen || loadingScreen.dataset.hidden === '1') return;
        loadingScreen.dataset.hidden = '1';
        loadingScreen.classList.add('fade-out', 'is-hidden');
        loadingScreen.style.pointerEvents = 'none';
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 500);
      }
      
      // 页面加载完成后隐藏
      window.addEventListener('load', function() {
        // 最少显示 800ms，让用户能看到加载效果
        setTimeout(hideLoadingScreen, 800);
      });
      
      // 如果页面加载时间超过 3 秒，也强制隐藏（防止卡住）
      setTimeout(hideLoadingScreen, 3000);
    </script>
</body>
</html>
