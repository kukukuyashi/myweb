# M6 生产编排 — 整站 ECS
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    extra_hosts:
      # Linux ECS 无 Docker Desktop，需 host-gateway 才能解析 host.docker.internal
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      # 笔记管理台：读写 Markdown 源
      - ./笔记:/data/notes
      # 前端静态站（仅供读取 img/ 等）
      - ./myweb:/data/web
      # 运行时数据（posts.json + Content/）：独立目录，与 myweb/ 物理隔离，防 rsync 覆盖
      - ./site-data:/data/site
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
  uploads_data: