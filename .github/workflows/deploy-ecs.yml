name: Deploy full site to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require ECS deploy secrets
        run: |
          missing=0
          [ -z "${{ secrets.ECS_HOST }}" ] && echo "::error::Missing secret ECS_HOST" && missing=1
          [ -z "${{ secrets.ECS_USER }}" ] && echo "::error::Missing secret ECS_USER" && missing=1
          [ -z "${{ secrets.ECS_SSH_KEY }}" ] && echo "::error::Missing secret ECS_SSH_KEY" && missing=1
          [ "$missing" -eq 1 ] && exit 1

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Python deps (cursor sprite generator)
        run: pip install Pillow

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_TWIKOO_ENV_ID: ${{ vars.VITE_TWIKOO_ENV_ID || 'https://cyinc-twikoo.netlify.app/.netlify/functions/twikoo' }}
          VITE_MUSIC_BASE_URL: ${{ vars.VITE_MUSIC_BASE_URL }}

      - name: Rsync frontend to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ecs
          chmod 600 ~/.ssh/id_ecs
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ecs -o StrictHostKeyChecking=accept-new" \
            docs/ "${ECS_USER}@${ECS_HOST}:/var/www/cyinc/myweb/"

      - name: Deploy API via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            APP_ROOT="${APP_ROOT:-/var/www/cyinc}"
            cd "$APP_ROOT"
            bash deploy/scripts/deploy.sh
