name: Deploy Vue3 Project

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Check music CDN config
      run: |
        if [ -z "${VITE_MUSIC_BASE_URL}" ]; then
          echo "::warning::未设置 VITE_MUSIC_BASE_URL，音乐室将无音频（Music/ 已不纳入 Git，需 CDN）"
        fi
      env:
        VITE_MUSIC_BASE_URL: ${{ vars.VITE_MUSIC_BASE_URL }}

    - name: Build project
      run: npm run build
      env:
        # Twikoo envId 会打进前端 bundle，非密钥；CI 无 .env.local 需在此注入
        VITE_TWIKOO_ENV_ID: https://cyinc-twikoo.netlify.app/.netlify/functions/twikoo
        # 音乐 CDN（GitHub → Settings → Secrets and variables → Actions → Variables）
        VITE_MUSIC_BASE_URL: ${{ vars.VITE_MUSIC_BASE_URL }}
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        force_orphan: true
