name: Deploy Vue3 Project

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build project
      run: npm run build
      env:
        # Twikoo envId 会打进前端 bundle，非密钥；CI 无 .env.local 需在此注入
        VITE_TWIKOO_ENV_ID: https://cyinc-twikoo.netlify.app/.netlify/functions/twikoo
        # 音乐 CDN（GitHub 仓库 Settings → Secrets and variables → Actions → Variables）
        # 设置后构建跳过复制 Music/，音频从 CDN 加载
        VITE_MUSIC_BASE_URL: ${{ vars.VITE_MUSIC_BASE_URL }}
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        force_orphan: true
