<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>404 - 页面不存在</title>
  <script>
    // GitHub Pages SPA fallback: 将路径保存到 query string，然后跳转到首页
    var path = window.location.pathname.replace(/^\/myweb/, '');
    window.location.href = '/myweb/?p=' + encodeURIComponent(path);
  </script>
</head>
<body>
  <p>正在跳转...</p>
</body>
</html>
